<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Gerencia!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">
  <div class="auth-card">
    <img src="assets/img/logo-gerencia.png" alt="Gerencia!" class="auth-logo">
    <div class="auth-header"><h1>Criar conta</h1><p>Escolha como você vai usar o Gerencia!</p></div>
    <div id="alertaCadastro" class="alert"></div>
    <form id="formCadastro">
      <div class="input-group"><label>Nome</label><input type="text" id="nome" required></div>
      <div class="input-group"><label>E-mail</label><input type="email" id="email" required></div>
      <div class="input-group"><label>Senha</label><input type="password" id="senha" minlength="6" required></div>
      <div class="input-group">
        <label>Tipo de uso</label>
        <div class="radio-row">
          <label><input type="radio" name="tipo_uso" value="pessoal" checked> Pessoal</label>
          <label><input type="radio" name="tipo_uso" value="autonomo"> Autônomo</label>
          <label><input type="radio" name="tipo_uso" value="empresa"> Empresa</label>
        </div>
      </div>
      <div class="input-group">
        <label>Documento</label>
        <div class="radio-row">
          <label><input type="radio" name="documento_tipo" value="CPF" checked> CPF</label>
          <label><input type="radio" name="documento_tipo" value="CNPJ"> CNPJ</label>
        </div>
        <input type="text" id="documento_numero" placeholder="Número do documento" style="margin-top:8px">
      </div>
      <div class="input-group">
        <label>Perfil detalhado</label>
        <select id="perfil_detalhado" required></select>
      </div>
      <div class="input-group">
        <label>Interface</label>
        <div class="radio-row">
          <label><input type="radio" name="nivel_interface" value="simples" checked> Simples: essencial</label>
          <label><input type="radio" name="nivel_interface" value="avancado"> Avançado: detalhes</label>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-block">Cadastrar</button>
    </form>
    <div class="auth-footer"><p><a href="login.html">Já tenho conta</a></p></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => Auth.inicializarCadastro());</script>
</body>
</html>
