<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Gerencia!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-login">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Criar Conta</h1>
                <p>Comece a gerenciar suas financas</p>
            </div>

            <div id="alerta" class="alert" style="display: none;"></div>

            <form id="formCadastro">
                <div class="input-group">
                    <label>Nome completo</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha" required>
                </div>

                <div class="input-group">
                    <label>Confirmar senha</label>
                    <input type="password" id="confirmar_senha" required>
                </div>

                <div class="input-group">
                    <label>Tipo de pessoa</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="tipo" value="PF" checked onchange="alternarTipoPessoa()">
                            Pessoa Fisica
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="tipo" value="PJ" onchange="alternarTipoPessoa()">
                            Pessoa Juridica (Empresa)
                        </label>
                    </div>
                </div>

                <div id="pfFields">
                    <div class="input-group">
                        <label>CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" 
                               oninput="aplicarMascara(this)" maxlength="14">
                    </div>
                </div>

                <div id="pjFields" style="display: none;">
                    <div class="input-group">
                        <label>CNPJ</label>
                        <input type="text" id="cnpj" placeholder="00.000.000/0000-00" 
                               oninput="aplicarMascara(this)" maxlength="18">
                    </div>
                    <div class="input-group">
                        <label>Razao Social</label>
                        <input type="text" id="razao_social" placeholder="Razao social da empresa">
                    </div>
                    <div class="input-group">
                        <label>Nome Fantasia</label>
                        <input type="text" id="nome_fantasia" placeholder="Nome fantasia">
                    </div>
                    <div class="input-group">
                        <label>Inscricao Estadual</label>
                        <input type="text" id="inscricao_estadual" placeholder="Opcional">
                    </div>
                </div>

                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>

            <div class="login-footer">
                <p>Ja tem conta? <a href="login.html">Faca login</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
