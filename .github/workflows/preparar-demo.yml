name: Preparar conta demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Preparar dados fictícios
        working-directory: backend
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEMO_EMAIL: ${{ secrets.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          test -n "$DB_HOST" || (echo "Falta configurar o segredo DB_HOST." && exit 1)
          test -n "$DB_PORT" || (echo "Falta configurar o segredo DB_PORT." && exit 1)
          test -n "$DB_NAME" || (echo "Falta configurar o segredo DB_NAME." && exit 1)
          test -n "$DB_USER" || (echo "Falta configurar o segredo DB_USER." && exit 1)
          test -n "$DB_PASSWORD" || (echo "Falta configurar o segredo DB_PASSWORD." && exit 1)
          test -n "$DEMO_PASSWORD" || (echo "Falta configurar o segredo DEMO_PASSWORD." && exit 1)
          node scripts/preparar-demo.js
