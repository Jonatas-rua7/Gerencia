<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Gerencia!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

<div class="auth-wrapper" style="max-width: 560px;">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>Criar Conta</h1>
            <p>Comece a gerenciar suas finanças hoje</p>
        </div>

        <div id="alerta" class="alert"></div>

        <div class="form-grid">
            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome" autocomplete="name">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Mín. 6 caracteres">
            </div>
            <div class="form-group">
                <label>Confirmar senha</label>
                <input type="password" id="confirmar_senha" placeholder="Repita a senha">
            </div>
        </div>

        <div class="form-group">
            <label>Tipo de conta</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="tipo" value="PF" checked onchange="alternarTipo()">
                    👤 Pessoa Física
                </label>
                <label class="radio-option">
                    <input type="radio" name="tipo" value="PJ" onchange="alternarTipo()">
                    🏢 Pessoa Jurídica
                </label>
            </div>
        </div>

        <div id="pfFields">
            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraDoc(this)">
            </div>
        </div>

        <div id="pjFields" style="display:none">
            <div class="form-grid">
                <div class="form-group">
                    <label>CNPJ</label>
                    <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" oninput="mascaraDoc(this)">
                </div>
                <div class="form-group">
                    <label>Razão Social</label>
                    <input type="text" id="razao_social" placeholder="Razão social">
                </div>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nome Fantasia</label>
                    <input type="text" id="nome_fantasia" placeholder="Nome fantasia">
                </div>
                <div class="form-group">
                    <label>Inscrição Estadual <small style="color:var(--text-muted)">(opcional)</small></label>
                    <input type="text" id="inscricao_estadual" placeholder="Opcional">
                </div>
            </div>
        </div>

        <button class="btn btn-primary btn-full btn-lg" id="btnCadastrar" style="margin-top: 8px;">
            Criar conta
        </button>

        <div class="auth-footer">
            Já tem conta? <a href="login.html">Fazer login</a>
        </div>
    </div>
</div>

<script type="module">
    import { carregarTema, mostrarAlerta, esconderAlerta, mascararCPF, mascararCNPJ, validarCPF, validarCNPJ, limparNumeros } from './js/utils.js';
    import { registrar } from './js/db.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { auth } from './js/firebase-config.js';

    carregarTema();

    onAuthStateChanged(auth, user => {
        if (user) window.location.href = 'index.html';
    });

    window.alternarTipo = function() {
        const tipo = document.querySelector('input[name="tipo"]:checked')?.value || 'PF';
        document.getElementById('pfFields').style.display = tipo === 'PF' ? 'block' : 'none';
        document.getElementById('pjFields').style.display = tipo === 'PJ' ? 'block' : 'none';
    };

    window.mascaraDoc = function(el) {
        if (el.id === 'cpf') el.value = mascararCPF(el.value);
        if (el.id === 'cnpj') el.value = mascararCNPJ(el.value);
    };

    document.getElementById('btnCadastrar').addEventListener('click', async () => {
        esconderAlerta('alerta');

        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value;
        const confirmar = document.getElementById('confirmar_senha').value;
        const tipo = document.querySelector('input[name="tipo"]:checked')?.value || 'PF';
        const cpf = document.getElementById('cpf')?.value || '';
        const cnpj = document.getElementById('cnpj')?.value || '';
        const razaoSocial = document.getElementById('razao_social')?.value.trim() || '';
        const nomeFantasia = document.getElementById('nome_fantasia')?.value.trim() || '';
        const inscricaoEstadual = document.getElementById('inscricao_estadual')?.value.trim() || '';

        if (nome.length < 3)            return mostrarAlerta('alerta', 'Informe o nome completo (mín. 3 caracteres).');
        if (!email.includes('@'))       return mostrarAlerta('alerta', 'Informe um e-mail válido.');
        if (senha.length < 6)           return mostrarAlerta('alerta', 'Senha deve ter mínimo 6 caracteres.');
        if (senha !== confirmar)        return mostrarAlerta('alerta', 'As senhas não conferem.');
        if (tipo === 'PF' && !validarCPF(cpf))   return mostrarAlerta('alerta', 'CPF inválido.');
        if (tipo === 'PJ' && !validarCNPJ(cnpj)) return mostrarAlerta('alerta', 'CNPJ inválido.');
        if (tipo === 'PJ' && razaoSocial.length < 3) return mostrarAlerta('alerta', 'Informe a razão social.');
        if (tipo === 'PJ' && nomeFantasia.length < 2) return mostrarAlerta('alerta', 'Informe o nome fantasia.');

        const btn = document.getElementById('btnCadastrar');
        btn.textContent = 'Criando conta...';
        btn.disabled = true;

        try {
            await registrar({
                nome, email, senha, tipo,
                cpf: limparNumeros(cpf),
                cnpj: limparNumeros(cnpj),
                razaoSocial, nomeFantasia, inscricaoEstadual
            });
            window.location.href = 'index.html';
        } catch (e) {
            const msg = e.code === 'auth/email-already-in-use' ? 'Este e-mail já está cadastrado.' :
                        e.code === 'auth/weak-password' ? 'Senha muito fraca.' :
                        'Erro ao criar conta. Tente novamente.';
            mostrarAlerta('alerta', msg);
            btn.textContent = 'Criar conta';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
