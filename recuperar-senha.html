<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar acesso | Gerencia!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">
  <div class="auth-card">
    <img src="assets/img/logo-gerencia.png" alt="Gerencia!" class="auth-logo">
    <div class="auth-header"><h1>Recuperar acesso</h1><p>Informe seu e-mail cadastrado</p></div>
    <div id="alertaRecuperar" class="alert"></div>
    <form id="formRecuperar">
      <div class="input-group"><label>E-mail</label><input type="email" id="email" required></div>
      <button type="submit" class="btn-primary btn-block">Solicitar recuperação</button>
    </form>
    <div class="auth-footer"><p><a href="login.html">Voltar ao login</a></p></div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => Auth.inicializarRecuperar());</script>
</body>
</html>
