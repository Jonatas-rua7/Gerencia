<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início | Gerencia!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <div class="main-wrap">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn-menu" id="btnMenu" type="button">☰</button>
          <h1>Início</h1>
        </div>
      </header>
      <main class="main-content">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="card" id="cardSaldoPrevisto" style="margin-bottom:20px"></div>
        <div class="card" id="cardRendaPrevista" style="margin-bottom:20px"></div>
        <div class="charts-row">
          <div class="card"><h3 class="card-title">Entradas e saídas (mês)</h3><div class="chart-box"><canvas id="chartFluxo"></canvas></div></div>
          <div class="card"><h3 class="card-title">Gastos por categoria</h3><div class="chart-box"><canvas id="chartCategorias"></canvas></div></div>
        </div>
        <div class="card">
          <h3 class="card-title">Avisos financeiros</h3>
          <div id="listaAvisos"></div>
        </div>
        <div class="card">
          <h3 class="card-title">Últimas movimentações reais</h3>
          <div class="table-wrap"><table><thead><tr><th>Data</th><th>O que foi</th><th>Valor</th></tr></thead><tbody id="ultimasMov"></tbody></table></div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/secrets.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
