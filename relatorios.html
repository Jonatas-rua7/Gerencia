<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios | Gerencia!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <div class="main-wrap">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn-menu" id="btnMenu" type="button">☰</button>
          <h1>Relatórios</h1>
        </div>
      </header>
      <main class="main-content">
        <div class="stats-grid" id="statsRel"></div>
        <div class="charts-row">
          <div class="card"><h3 class="card-title">Resultado mensal</h3><div class="chart-box"><canvas id="chartMensal"></canvas></div></div>
          <div class="card"><h3 class="card-title">Gastos por categoria</h3><div class="chart-box"><canvas id="chartGastos"></canvas></div></div>
        </div>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <h3 class="card-title" style="margin:0">Fluxo de caixa projetado</h3>
            <div style="display:flex;gap:8px">
              <button class="btn-sm btn-secondary" data-dias="30">30 dias</button>
              <button class="btn-sm btn-secondary" data-dias="60">60 dias</button>
              <button class="btn-sm btn-secondary" data-dias="90">90 dias</button>
            </div>
          </div>
          <div id="alertaFluxo" class="alert" style="display:none;margin-bottom:16px"></div>
          <div class="chart-box" style="margin-bottom:16px"><canvas id="chartFluxoProjetado"></canvas></div>
          <div class="table-wrap"><table><thead><tr><th>Data</th><th>Entradas previstas</th><th>Saídas previstas</th><th>Saldo do dia</th><th>Saldo acumulado</th></tr></thead><tbody id="tabelaFluxo"></tbody></table></div>
        </div>
        <div class="card">
          <h3 class="card-title">Pendências financeiras</h3>
          <div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th>Status</th></tr></thead><tbody id="tabelaPend"></tbody></table></div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/secrets.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/relatorios.js"></script>
</body>
</html>
