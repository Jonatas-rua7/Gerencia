<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Gerencia!</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">
  <div class="auth-card">
    <img src="assets/img/logo-gerencia.png" alt="Gerencia!" class="auth-logo">
    <div class="auth-header"><h1>Bem-vindo de volta</h1><p>Organize sua vida financeira com clareza</p></div>
    <div id="alertaLogin" class="alert"></div>
    <form id="formLogin">
      <div class="input-group"><label>E-mail</label><input type="email" id="email" required></div>
      <div class="input-group"><label>Senha</label><input type="password" id="senha" required></div>
      <button type="submit" class="btn-primary btn-block">Entrar</button>
    </form>
    <div class="auth-footer">
      <p><a href="recuperar-senha.html">Esqueci minha senha</a></p>
      <p style="margin-top:10px"><a href="cadastro.html">Criar conta</a></p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => Auth.inicializarLogin());</script>
</body>
</html>
